name: Zig 0.16

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - name: Compile Deez readiness surface
        run: zig build deez-readiness-test

  v06-bootstrap:
    if: github.head_ref == 'bongo-0.6.0-rapid' || github.ref_name == 'bongo-0.6.0-rapid'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bongo-0.6.0-rapid
          fetch-depth: 0
      - name: Apply v0.6 validation and retry hardening patch
        run: python3 tools/v06_test_patch.py
      - name: Commit validation and reliability changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test build.zig Makefile scripts/ensure-mongo-fixture.sh
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Add v0.6 retry and malformed-wire validation"
          git push origin HEAD:bongo-0.6.0-rapid
