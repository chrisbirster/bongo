name: Zig 0.16

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - name: Compile Deez readiness surface
        run: |
          zig test src/mongo/query.zig
          zig test src/mongo/session.zig
          zig test src/mongo/pool.zig
          zig test src/mongo/topology.zig
          zig test src/mongo/transaction.zig
          zig test src/mongo/runtime_client.zig
