name: Zig 0.16

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - name: Compile Deez readiness surface
        run: zig build deez-readiness-test

  v06-bootstrap:
    if: github.head_ref == 'bongo-0.6.0-rapid' || github.ref_name == 'bongo-0.6.0-rapid'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bongo-0.6.0-rapid
          fetch-depth: 0
      - name: Fix Zig 0.16 read-pool retry iteration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/mongo/runtime_read.zig")
          text = path.read_text()
          old = "for (self.pools.items) |*server_pool| {"
          new = "for (self.pools.items) |server_pool| {"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one retry loop anchor, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("retry loop anchor not found")
          PY
      - name: Apply idempotent v0.6 finalization patch
        run: python3 tools/v06_finalize_patch.py
      - name: Commit validation and reliability changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test build.zig Makefile scripts/ensure-mongo-fixture.sh
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Fix read-pool retry iteration"
          git push origin HEAD:bongo-0.6.0-rapid
