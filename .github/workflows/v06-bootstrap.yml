name: v0.6 bootstrap patch

on:
  push:
    branches:
      - bongo-0.6.0-rapid
    paths:
      - tools/v06_patch.py
      - .github/workflows/v06-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bongo-0.6.0-rapid
          fetch-depth: 0
      - name: Apply deterministic v0.6 patch
        run: python3 tools/v06_patch.py
      - name: Commit patched runtime and pinned fixtures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Implement v0.6 retry reliability core"
          git push origin HEAD:bongo-0.6.0-rapid

# Triggered after the workflow exists so GitHub evaluates this push.
