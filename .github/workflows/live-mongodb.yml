name: Live MongoDB

on:
  push:
  pull_request:

jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/ensure-mongo-fixture.sh tls
      - run: zig build tls-integration-test

  transactions-and-cmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/ensure-mongo-fixture.sh replset
      - run: zig build runtime-integration-test
      - run: zig build cmap-integration-test

  sdam-and-retryability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/ensure-mongo-fixture.sh sdam
      - run: zig build sdam-integration-test
      - run: zig build retryability-integration-test
