services:
  bongo-linux-validation:
    build:
      context: .
      dockerfile: Dockerfile.linux-test
      args:
        ZIG_VERSION: "0.16.0"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    # No host ports are published. MongoDB and all Bongo tests run inside this
    # same Linux container, so binding 27017/27018/27019 on the host is both
    # unnecessary and can conflict with an existing local MongoDB instance.
